{% extends 'base.html' %}

{% block title%}Inicio{% endblock %}

{% block content %}
    <h2>Lista de Productos Dinámicos</h2>
    <ul>
        {% for item in items %}
            <li>ID: {{ item.id }} - {{ item.nombre }} - {{ item.precio }}</li>
        {% empty %}
            <li>No hay elementos disponibles.</li>
        {% endfor %}
    </ul>
{% endblock %}
