{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi proyecto{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/' %}">
</head>
<body>
    <header>
        <img src="{% static 'images/' %}" alt="logo" class="logo">
        <nav>
            <ul>
                <li><a href="{% url 'inicio' %}">Inicio</a></li>
                <li><a href="{% url 'vista_dos' %}">Sección Dos</a></li>
                <li><a href="{% url 'vista_tres' %}">Sección Tres</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 - laboratorio django backend</p>
    </footer>
</body>
</html>
